name: Setup
description: Checkout repository and log in to Docker Hub

inputs:
  docker_username:
    description: Docker Hub username
    required: true
  docker_password:
    description: Docker Hub password
    required: true

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: Prepare prod files
      shell: bash
      run: |
          mv docker-compose.yml docker-compose.bak.yml
          cp docker/prod/docker-compose.prod.yml docker-compose.yml
