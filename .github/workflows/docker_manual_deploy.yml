name: deploy_docker_manual

on:
  push:
    branches:
      - develop-test
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
      environment:
        description: playground, staging, demo or prod for worker and web or exact Env name like iaso-stg-worker. Using `upgrade` for now to test
        required: true
        default: upgrade
      tag:
        description: Tag to deploy
        required: false
        default: develop-test
      slack_channel:
        description: Slack Channel for notification (iasops by default)
        required: false
        default: cloud-alerts

permissions:
  contents: read
  packages: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      environment: ${{ steps.vars.outputs.environment }}
      slack_channel: ${{ steps.vars.outputs.slack_channel }}
    steps:
      - name: Set configs
        id: vars
        env:
          DEFAULT_GIT_REFERENCE: main
          DEFAULT_ENVIRONMENT: upgrade
          DEFAULT_SLACK_CHANNEL: cloud-alerts
        run: |
          echo "branch=${{ github.event.inputs.branch || github.ref_name || env.DEFAULT_GIT_REFERENCE }}" >> $GITHUB_OUTPUT
          INPUT_TAG="${{ github.event.inputs.tag }}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "image_tag=${INPUT_TAG:-${SHORT_SHA}}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || env.DEFAULT_ENVIRONMENT }}" >> $GITHUB_OUTPUT
          echo "slack_channel=${{ github.event.inputs.slack_channel || env.DEFAULT_SLACK_CHANNEL }}" >> $GITHUB_OUTPUT

  deploy:
    needs: [ config ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Slack deployment start
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.TEST_SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ needs.config.outputs.slack_channel }}
          SLACK_COLOR: ""
          SLACK_USERNAME: ${{ needs.config.outputs.environment }}
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_TITLE: Started deployment of ${{ needs.config.outputs.image_tag }} on ${{ needs.config.outputs.environment }} ...
          SLACK_FOOTER: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          MSG_MINIMAL: true

      - name: Display banner
        run: |
          echo "
           ___    _    ____   ___
          |_ _|  / \  / ___| / _ \\
           | |  / _ \ \___ \| | | |
           | | / ___ \ ___) | |_| |
          |___/_/   \_\____/ \___/
          ------------------------
          Deploying ${{ needs.config.outputs.image_tag }} to ${{ needs.config.outputs.environment }}
          $(date)
          "

      - name: Verify image exists on Docker Hub
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/blsq/iaso/tags/${{ needs.config.outputs.image_tag }}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Image blsq/iaso:${{ needs.config.outputs.image_tag }} not found on Docker Hub"
            exit 1
          fi
          echo "Image blsq/iaso:${{ needs.config.outputs.image_tag }} found"

      - name: Swap to prod docker config
        run: |
          echo "Replace docker-compose with prod version"
          mv docker-compose.yml docker-compose.bak.yml
          cp docker/prod/docker-compose.prod.yml docker-compose.yml
          git add -f docker-compose.yml

          echo "Move Dockerfile to root"
          cp docker/prod/Dockerfile .

          echo "Replace .platform with prod version"
          mv .platform .platform.bak
          cp -r docker/prod/.platform .platform
          git add -f .platform

          echo "Remove dev eb extensions from git stage"
          git rm -r --cached --quiet .ebextensions

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Setup beanstalk
        run: |
          cp .elasticbeanstalk/config.upgrade.yml .elasticbeanstalk/config.yml
          pip install awsebcli==3.27.1 botocore==1.42.92 boto3==1.42.92

      - name: Deploy to beanstalk (Docker) using scripts/eb_deploy.py
        run: python scripts/eb_deploy.py ${{ needs.config.outputs.environment }}
        env:
          PROD_BUILD_IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          VERSION_NAME: ${{ needs.config.outputs.image_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"

      - name: Slack deployment success notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.TEST_SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ needs.config.outputs.slack_channel }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_USERNAME: ${{ needs.config.outputs.environment }}
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_TITLE: Iaso ${{ needs.config.outputs.image_tag }} successfully deployed on ${{ needs.config.outputs.environment }}
          SLACK_MESSAGE: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          SLACK_FOOTER: "-"
          MSG_MINIMAL: true
        if: success()

      - name: Slack deployment failure notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.TEST_SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ needs.config.outputs.slack_channel }}
          SLACK_USERNAME: ${{ needs.config.outputs.environment }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_TITLE: Deployment failure Iaso ${{ needs.config.outputs.image_tag }} - ${{ needs.config.outputs.environment }}
          SLACK_MESSAGE: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          SLACK_FOOTER: "-"
          MSG_MINIMAL: true
        if: failure()
