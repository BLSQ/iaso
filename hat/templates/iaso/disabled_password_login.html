{% extends 'iaso/base_auth.html' %}
{% load i18n %}
{% load static %}
{% block body %}
<div class="auth__container iasologin">
  <div class="auth__content">
    {% if logo_path %}
      <header class="auth__header">
        <h1 class="auth__heading"> <img alt="logo" src="{% static logo_path %}" /></h1>
      </header>
    {% endif %}
    <div>
      {% for provider in sso_providers_for_login %}
        {% include "sso/login_subtemplate.html" %}
      {% endfor %}
      {% include "./language_picker.html" %}
    </div>
  </div>
</div>

{% endblock %}
