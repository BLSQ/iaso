{% load i18n %}

{% block extrahead %}
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" type="text/css"
        rel="stylesheet">
  <style>
      * {
          box-sizing: border-box; /* gives padding and border from inside */
      }

      #show_hide_password {
          position: relative; /* for absolute child element */
          display: inline-block; /* to take the width of the input */
      }

      #show_hide_password input {
          text-align: left;
          width: 300px;
          height: 30px; /* added to match the height of the #click div */
          outline: 0; /* to remove outline when focused */
      }

      .input-group-addon {
          width: 30px;
          height: 30px;
          padding: 5px 0;
          position: absolute; /* to align it to right and positon it over the input */
          top: 0;
          right: 0;
          background: lightgrey;
          text-align: center;
      }

      .input-group-addon > a {
          font-size: 16px;
      }
  </style>
{% endblock %}

<div class="input-group django_password_eye" id="show_hide_password">
  <input type="password"
         id="input-password-reveal"
         name="{{ widget.name }}"
         maxlength=50
         class="form-control"
         placeholder="{% trans 'Password' %}"
         data-toggle="password"
         style="display: inline-block"
    {% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}
    {% include "django/forms/widgets/attrs.html" %}
  >
  <div class="input-group-addon form-control link">
    <a>
      <i class="fa fa-eye-slash" aria-hidden="true"></i>
    </a>
  </div>
</div>
