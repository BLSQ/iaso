name: Iaso CI testing
# This workflow can run all backend and frontend tests

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend_tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Use node.js 22.18.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm

      - name: upgrade npm
        run: |
          npm install --global npm@11.13.0

      - name: Environment info
        run: |
          node --version
          npm --version

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm test
        run: npm test

      - name: Check Frontend (JS/React) translations
        run: python scripts/update_trads.py

      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_USERNAME: ${{ github.workflow }}
          SLACK_ICON_EMOJI: ':robot_face:'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: iaso-dev
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: ${{ format('Job {0} failed on {1}', github.job, github.ref) }}
          SLACK_FOOTER: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          MSG_MINIMAL: true
        if: failure()

  backend_tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a health check
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: true
      DJANGO_SETTINGS_MODULE: hat.settings
      PLUGINS: polio,wfp,wfp_auth
      RDS_DB_NAME: github_actions
      SECRET_KEY: secret
      RDS_HOSTNAME: localhost
      RDS_PASSWORD: postgres
      RDS_PORT: 5432
      RDS_USERNAME: postgres
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Install Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install GDAL and gettext
        run: sudo apt-get update && sudo apt install gdal-bin gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Environment info
        run: uv tree --all-groups

      - name: Check Backend (Django) translations
        run: |
          uv run python manage.py make_translations
          uv run python manage.py compile_translations

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check

      - name: Django tests
        run: |
          uv run python manage.py migrate
          uv run python manage.py createcachetable
          uv run python -W "ignore" manage.py test --parallel auto
          # --parallel: run the suite across one process per CPU core (see IA-5186)

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_USERNAME: ${{ github.workflow }}
          SLACK_ICON_EMOJI: ':robot_face:'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: iaso-dev
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: ${{ format('Job {0} failed on {1}', github.job, github.ref) }}
          SLACK_FOOTER: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          MSG_MINIMAL: true
        if: failure()

  backend_lint_and_format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "--version"
          version: "0.9.6"

      - name: Linting with ruff
        run: ruff check --output-format=github .

      - name: Formatting with ruff
        run: ruff format --check .

  frontend_lint_and_format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Use node.js 22.18.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm

      - name: upgrade npm
        run: |
          npm install --global npm@11.13.0

      - name: Environment info
        run: |
          node --version
          npm --version

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check ESLint
        run: npm run show-lint-problems
