name: IASO nightly checks (tests + setuper)
on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  workflow_dispatch:
    inputs:
      iaso_branch:
        description: IASO branch to use (for running tests and setuper)
        required: false
        type: string
        default: develop


permissions:
  contents: read
  packages: read

jobs:
  tests:
    uses: BLSQ/iaso-ci/.github/workflows/tests.yml@main
    with:
      iaso_branch: ${{ github.event.inputs.iaso_branch }}

  setuper:
    uses: BLSQ/iaso-ci/.github/workflows/setuper.yml@main
    with:
      iaso_branch: ${{ github.event.inputs.iaso_branch }}
