name: Iaso main branch
on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: read

jobs:
  check_on_main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main-test
#          ref: main

      - name: Check if tag is part of main
        run: git branch --contains tags/${{ github.ref_name }}

  tests:
    needs: [ check_on_main ]
    uses: ./.github/workflows/wc_tests.yml
    with:
      #      branch: main
      branch: main-test

  build_and_push_image:
    needs: [ check_on_main, tests ]
    uses: ./.github/workflows/wc_docker_build.yml
    with:
      #      branch: main
      branch: main-test
      image_tags: ${{ github.ref_name }},main
    secrets: inherit
