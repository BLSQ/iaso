# Core schedules only. On deploy, .platform/hooks/predeploy/10_merge_plugin_cron.sh
# appends plugins/<name>/cron.yaml for each name in PLUGINS. sqsd then reads this file.
version: 1
cron:
    - name: 'reap_lost_tasks'
      url: '/tasks/reap_lost_tasks/'
      schedule: '*/5 * * * *'
    - name: 'setuper_sandbox'
      url: '/tasks/launch_task/iaso.tasks.setuper_sandbox.setuper_sandbox/cron_task_sandbox_user/'
      schedule: '0 4 * * *'
