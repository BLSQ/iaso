<!doctype html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IASO — {% block title %}Authorize{% endblock %}</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; background: #f8fafc; color: #0f172a; }
      .container { width: 100%; max-width: 28rem; display: flex; flex-direction: column; gap: 1.5rem; }
      .logo { height: 3rem; width: auto; display: block; margin: 0 auto; }
      h2 { margin-top: 0.5rem; text-align: center; font-size: 1.5rem; font-weight: 650; }
      .subtitle { text-align: center; font-size: 0.875rem; color: #64748b; margin-top: 0.35rem; }
      .scopes { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem 1.25rem; }
      .scopes h3 { font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 0.75rem; }
      .scopes ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
      .scopes li { display: flex; align-items: flex-start; font-size: 0.875rem; line-height: 1.4; }
      .tool-name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8125rem; }
      .tool-desc { color: #64748b; }
      .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.75rem; padding: 1rem; }
      .error-box h3 { font-size: 0.875rem; font-weight: 600; color: #991b1b; }
      .error-box p { font-size: 0.875rem; color: #b91c1c; margin-top: 0.25rem; }
      .actions { display: flex; gap: 0.75rem; margin-top: 0.25rem; }
      .btn { flex: 1; padding: 0.625rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-primary { background: #fbbf24; color: #0f172a; border: 1px solid transparent; }
      .btn-primary:hover { background: #f59e0b; }
      .btn-secondary { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
      {% block extra_css %}{% endblock %}
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="{% static 'mcp/iaso-mark.png' %}" alt="IASO" />
      {% block body %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
