name: Deploy IASO docker

on:
  workflow_call:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
      environment:
        description: playground, staging, demo or prod for worker and web or exact Env name like iaso-stg-worker. Using `upgrade` for now to test
        required: true
        type: string
      image_tag:
        description: Tag to deploy (without the "blsq/iaso:" prefix, e.g. "develop", "IA-4856", or "v2026.06.01")
        required: true
        type: string
      slack_channel:
        description: Slack Channel for notification (iasops by default)
        required: false
        default: cloud-alerts
        type: string

permissions:
  contents: read
  packages: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      slack_channel: ${{ steps.vars.outputs.slack_channel }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Set configs
        id: vars
        env:
          DEFAULT_SLACK_CHANNEL: cloud-alerts
        run: |
          echo "slack_channel=${{ github.event.inputs.slack_channel || env.DEFAULT_SLACK_CHANNEL }}" >> $GITHUB_OUTPUT
          if [ -n "$GITHUB_SHA" ]; then
            echo "short_sha=${GITHUB_SHA:0:12}" >> $GITHUB_OUTPUT
          else
            echo "short_sha=manual-$(openssl rand -hex 3)" >> $GITHUB_OUTPUT
          fi

  check_image:
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.image_data.outputs.image_digest }}
      image_timestamp: ${{ steps.image_data.outputs.image_timestamp }}
    steps:
      - name: Check if image blsq/iaso:${{ inputs.image_tag }} exists on Docker Hub
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/blsq/iaso/tags/${{ inputs.image_tag }}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Image blsq/iaso:${{ inputs.image_tag }} not found on Docker Hub"
            exit 1
          fi
          echo "Image blsq/iaso:${{ inputs.image_tag }} found"

      - name: Pull the image and inspect it to get the digest and timestamp
        id: image_data
        run: |
          docker pull blsq/iaso:${{ inputs.image_tag }}
          echo "image_digest=$(docker image inspect blsq/iaso:${{ inputs.image_tag }} --format='{{index .RepoDigests 0}}' | cut -d ':' -f2)" >> $GITHUB_OUTPUT
          echo "image_timestamp=$(docker image inspect blsq/iaso:${{ inputs.image_tag }} --format='{{ index .Created }}')" >> $GITHUB_OUTPUT

  deploy:
    needs: [ config, check_image ]
    runs-on: ubuntu-24.04
    env:
      MSG_MINIMAL: true
      SLACK_CHANNEL: ${{ needs.config.outputs.slack_channel }}
      SLACK_ICON_EMOJI: ":robot_face:"
      SLACK_USERNAME: ${{ inputs.environment }}
      SLACK_WEBHOOK: ${{ secrets.TEST_SLACK_WEBHOOK }}
      SLACK_MESSAGE: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
      SLACK_FOOTER: "-"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Slack deployment start
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: ""
          SLACK_TITLE: Started deployment of ${{ inputs.image_tag }} on ${{ inputs.environment }} ...

      - name: Deploying ${{ inputs.image_tag }} to ${{ inputs.environment }}, using branch ${{ inputs.branch }}
        run: |
          echo "
           ___    _    ____   ___
          |_ _|  / \  / ___| / _ \\
           | |  / _ \ \___ \| | | |
           | | / ___ \ ___) | |_| |
          |___/_/   \_\____/ \___/
          ------------------------
          Deploying ${{ inputs.image_tag }} to ${{ inputs.environment }}, using branch ${{ inputs.branch }}
          $(date)
          "

      - name: Gather required files for deployment
        run: |
          docker compose -f docker/prod/docker-compose.prod.yml -f docker/prod/docker-compose.test.yml config --no-interpolate --no-path-resolution --no-normalize > deployment/docker-compose.yml
          mv cron.yaml deployment/cron.yaml
#          mv docker/prod/docker-compose.prod.yml deployment/docker-compose.yml

      - name: Set env vars in beanstalk config
        run: |
          sed -i s/deployed_by_value/${GITHUB_ACTOR}/g ./deployment/.ebextensions/environment.config
          sed -i "s/deployed_on_value/$(date --rfc-3339=seconds)/g" ./deployment/.ebextensions/environment.config
          sed -i s/prod_image_digest_value/${{ needs.check_image.outputs.image_digest }}/g ./deployment/.ebextensions/environment.config
          sed -i s/prod_image_creation_value/${{ needs.check_image.outputs.image_timestamp }}/g ./deployment/.ebextensions/environment.config
          sed -i s/prod_image_tag_value/${{ inputs.image_tag }}/g ./deployment/.ebextensions/environment.config
          sed -i s/plugin_env_1_value/plugin_1/g ./deployment/.ebextensions/environment.config
          sed -i s/plugin_env_2_value/plugin_2/g ./deployment/.ebextensions/environment.config
          sed -i s/plugin_env_3_value/plugin_3/g ./deployment/.ebextensions/environment.config
          cat ./deployment/.ebextensions/environment.config

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Setup beanstalk
        run: |
          pip install awsebcli==3.27.1 botocore==1.42.92 boto3==1.42.92

      - name: Determine EBS version name
        id: version
        run: |
          echo "VERSION_NAME=${{ inputs.image_tag }}-${{ needs.config.outputs.short_sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to beanstalk (Docker) using scripts/eb_deploy.py
        run: |
          cd deployment
          git add .
          git status
          python ../scripts/eb_deploy.py ${{ inputs.environment }}
        env:
          # VERSION_NAME is the ID of the package generated by EBS that's gonna be deployed. It needs to be unique, otherwise an old package will be reployed
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"

      - name: Slack deployment success notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Iaso ${{ inputs.image_tag }} successfully deployed on ${{ inputs.environment }}
        if: success()

      - name: Slack deployment failure notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Deployment failure Iaso ${{ inputs.image_tag }} - ${{ inputs.environment }}
        if: failure()
