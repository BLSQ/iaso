name: Build IASO docker prod image

on:
  workflow_call:
    inputs:
      image_tags:
        description: Tag(s) to push the image with (comma-separated if multiple, e.g. "latest,develop"). The "blsq/iaso:" prefix is added automatically.
        required: true
        type: string
      branch:
        description: Branch to build
        required: true
        type: string

jobs:
  docker_build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Building IASO image based on branch ${{ inputs.branch }}
        run: |
          echo "
           ___    _    ____   ___
          |_ _|  / \  / ___| / _ \\
           | |  / _ \ \___ \| | | |
           | | / ___ \ ___) | |_| |
          |___/_/   \_\____/ \___/
          ------------------------
          Building IASO image based on branch ${{ inputs.branch }}
          $(date)
          "

      - name: Format image tags
        id: tags
        env:
          INPUT_TAGS: ${{ inputs.image_tags }}
        run: |
          echo "value=$(echo "$INPUT_TAGS" | tr ',' '\n' | sed 's|^|blsq/iaso:|' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          file: docker/prod/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.value }}
          # https://docs.docker.com/build/cache/backends/
          cache-from: type=registry,ref=blsq/iaso:buildcache
          cache-to: type=registry,ref=blsq/iaso:buildcache,mode=max