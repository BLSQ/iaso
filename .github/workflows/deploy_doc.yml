name: deploy_doc

on:
  workflow_dispatch:
    inputs:
      slack_channel:
        description: Slack Channel for notification (iasops by default)
        required: false
        default: iasops
  push:
    # On push to develop deploy doc to GH pages
    branches:
      - develop


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set configs
        id: config
        env:
            DEFAULT_GIT_REFERENCE: develop
        run: |
            echo "::set-output name=GIT_REFERENCE::${{ github.ref_name || env.DEFAULT_GIT_REFERENCE }}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.config.outputs.GIT_REFERENCE }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: docs

      - name: Install docs dependencies
        run: uv sync --only-group docs --locked

      - name: Environment info
        run: uv tree --only-group docs

# TODO: enable this step once all docs links are fixed to catch issues before deploying
#      - name: Build docs
#        run: uv run --no-sync mkdocs build --config-file mkdocs.yml --strict

      - name: Deploy on Github pages
        run: uv run --no-sync mkdocs gh-deploy --config-file mkdocs.yml
